<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-label="Aura Pens logo">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#6d5ef0" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#2b1a5e" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#06040f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#d9d4e8"/>
      <stop offset="100%" stop-color="#9b93b5"/>
    </linearGradient>
    <linearGradient id="penBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2b3a6e"/>
      <stop offset="45%" stop-color="#131c44"/>
      <stop offset="100%" stop-color="#05081c"/>
    </linearGradient>
  </defs>
  <rect width="360" height="200" rx="28" fill="#070512"/>
  <rect width="360" height="200" rx="28" fill="url(#glow)"/>
  <!-- flourishes -->
  <g fill="none" stroke="url(#silver)" stroke-width="2" opacity=".85" stroke-linecap="round">
    <path d="M28 78 C 60 50, 96 62, 108 84 C 96 78, 78 78, 70 90"/>
    <path d="M332 78 C 300 50, 264 62, 252 84 C 264 78, 282 78, 290 90"/>
    <path d="M60 92 C 90 88, 120 92, 140 102 M300 92 C 270 88, 240 92, 220 102"/>
  </g>
  <!-- ink bottle + nib -->
  <g transform="translate(180 52)">
    <rect x="-26" y="-18" width="52" height="40" rx="7" fill="#12172e" stroke="url(#silver)" stroke-width="2.5"/>
    <rect x="-26" y="-8" width="52" height="30" rx="7" fill="#02040c"/>
    <rect x="-18" y="-30" width="36" height="14" rx="6" fill="url(#silver)"/>
    <g transform="rotate(35)">
      <rect x="-7" y="-34" width="14" height="62" rx="7" fill="url(#silver)" stroke="#0a0a14" stroke-width="1.5"/>
      <path d="M-7 -2 L0 12 L7 -2 Z" fill="url(#silver)" stroke="#0a0a14" stroke-width="1.2"/>
      <circle cx="0" cy="2" r="1.6" fill="#0a0a14"/>
    </g>
  </g>
  <text x="180" y="132" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="52" fill="url(#silver)" letter-spacing="1">Aura Pens</text>
  <g transform="translate(180 152)">
    <rect x="-118" y="-11" width="236" height="22" rx="11" fill="none" stroke="#4a4368" stroke-width="1"/>
    <text y="5" text-anchor="middle" font-family="Verdana, sans-serif" font-size="12" letter-spacing="3.5" fill="#cfc9e4">made for comfort</text>
  </g>
</svg>
